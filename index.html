<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Bazaar | Collection</title>

<style>
/* ---------- RESET ---------- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #355673;
    color: #ffffff;
}

img {
    max-width: 100%;
    height: auto;
    display: block;
}

button {
    cursor: pointer;
    border: none;
    font-family: inherit;
}

/* =========================================================
   HEADER & NAVIGATION BAR
   ========================================================= */
.navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #28445d;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 7vw;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.logo {
    font-family: Georgia, serif;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #fff;
}

.cart-icon-btn {
    background: transparent;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 20px;
    transition: all 0.3s ease;
}

.cart-icon-btn:hover {
    background: #ffffff;
    color: #222;
}

.cart-badge {
    background: #8b2e3c;
    color: #fff;
    border-radius: 50%;
    padding: 2px 7px;
    font-size: 11px;
}

/* =========================================================
   PRODUCT COLLECTION GRID
   ========================================================= */
.products-section {
    padding: 60px 7vw 90px;
}

.section-title {
    font-family: Georgia, serif;
    font-size: clamp(32px, 4vw, 50px);
    margin-bottom: 30px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto;
}

.product-card {
    background: #2b455c;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    transition: transform 0.3s ease;
}

.product-card:hover {
    transform: translateY(-5px);
}

.product-image {
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.product-info {
    padding: 20px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.product-category {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.6;
    margin-bottom: 6px;
    text-transform: uppercase;
}

.product-title {
    font-family: Georgia, serif;
    font-size: 18px;
    margin-bottom: 8px;
}

.product-price {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 15px;
}

.btn-group {
    display: flex;
    gap: 10px;
    margin-top: auto;
}

.view-btn {
    flex: 1;
    padding: 12px;
    background: transparent;
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.4);
    font-weight: bold;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 6px;
    transition: all 0.3s ease;
}

.view-btn:hover {
    background: rgba(255, 255, 255, 0.15);
}

.add-to-cart-btn {
    flex: 1;
    padding: 12px;
    background: #ffffff;
    color: #222222;
    font-weight: bold;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 6px;
    transition: all 0.3s ease;
}

.add-to-cart-btn:hover {
    background: #8b2e3c;
    color: #ffffff;
}

/* =========================================================
   QUICK-VIEW PRODUCT MODAL
   ========================================================= */
.product-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    z-index: 250;
    padding: 20px;
}

.product-modal-overlay.active {
    opacity: 1;
    visibility: visible;
}

.product-modal-content {
    background: #1e3345;
    width: 100%;
    max-width: 750px;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

.close-modal-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    background: transparent;
    color: #fff;
    font-size: 28px;
    z-index: 10;
}

.modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
}

.modal-image {
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
}

.modal-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.modal-details {
    padding: 35px 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.modal-category {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 8px;
}

.modal-details h2 {
    font-family: Georgia, serif;
    font-size: 26px;
    margin-bottom: 12px;
}

.modal-price {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 18px;
    color: #a9d2e6;
}

.modal-details p {
    font-size: 13px;
    line-height: 1.6;
    opacity: 0.8;
    margin-bottom: 25px;
}

.modal-add-btn {
    width: 100%;
    padding: 14px;
    background: #8b2e3c;
    color: #ffffff;
    font-weight: bold;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 6px;
    transition: background 0.3s ease;
}

.modal-add-btn:hover {
    background: #a33848;
}

/* =========================================================
   CART DRAWER & CHECKOUT
   ========================================================= */
.cart-overlay, .checkout-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    z-index: 300;
}

.cart-overlay.active, .checkout-modal.active {
    opacity: 1;
    visibility: visible;
}

.cart-drawer {
    position: fixed;
    top: 0;
    right: -420px;
    width: 100%;
    max-width: 400px;
    height: 100%;
    background: #1e3345;
    z-index: 301;
    display: flex;
    flex-direction: column;
    transition: right 0.3s ease;
    box-shadow: -5px 0 25px rgba(0,0,0,0.3);
}

.cart-drawer.active {
    right: 0;
}

.cart-header {
    padding: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.empty-cart-msg {
    text-align: center;
    margin-top: 40px;
    opacity: 0.6;
    font-size: 14px;
}

.cart-item {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
    background: #28445d;
    padding: 12px;
    border-radius: 8px;
}

.cart-item-img {
    width: 50px;
    height: 65px;
    object-fit: cover;
    border-radius: 4px;
}

.cart-item-details {
    flex: 1;
}

.cart-item-title {
    font-size: 13px;
    margin-bottom: 4px;
}

.cart-item-price {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
}

.qty-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.qty-btn {
    background: #355673;
    color: #fff;
    width: 22px;
    height: 22px;
    border-radius: 4px;
    font-weight: bold;
}

.remove-item-btn {
    background: transparent;
    color: #ff6b6b;
    font-size: 11px;
    margin-left: auto;
}

.cart-footer {
    padding: 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    background: #182a39;
}

.cart-total-row {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 15px;
}

.checkout-btn {
    width: 100%;
    padding: 14px;
    background: #8b2e3c;
    color: #fff;
    font-weight: bold;
    letter-spacing: 1px;
    border-radius: 6px;
    text-transform: uppercase;
}

.checkout-modal {
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 400;
    padding: 20px;
}

.checkout-content {
    background: #243c50;
    width: 100%;
    max-width: 480px;
    border-radius: 12px;
    padding: 30px;
    position: relative;
}

.checkout-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.form-group label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.8;
}

.form-group input {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    background: #182a39;
    color: #fff;
}

.pay-now-btn {
    margin-top: 10px;
    padding: 14px;
    background: #27ae60;
    color: #fff;
    font-weight: bold;
    border-radius: 6px;
    text-transform: uppercase;
}

@media (max-width: 650px) {
    .modal-grid {
        grid-template-columns: 1fr;
    }
    .modal-image {
        aspect-ratio: 16 / 9;
    }
}
</style>
</head>

<body>

<!-- NAVIGATION BAR -->
<nav class="navbar">
    <div class="logo">STYLE BAZAAR</div>
    <button class="cart-icon-btn" onclick="toggleCart()">
        <span>BAG</span>
        <span class="cart-badge" id="cartCount">0</span>
    </button>
</nav>

<!-- PRODUCT CATALOGUE -->
<section class="products-section">
    <h2 class="section-title">New Collection</h2>
    <div class="product-grid" id="productGrid"></div>
</section>

<!-- PRODUCT QUICK-VIEW MODAL -->
<div class="product-modal-overlay" id="productModal" onclick="closeProductModal(event)">
    <div class="product-modal-content">
        <button class="close-modal-btn" onclick="closeProductModal()">&times;</button>
        <div class="modal-grid">
            <div class="modal-image">
                <img id="modalImg" src="" alt="">
            </div>
            <div class="modal-details">
                <div id="modalCategory" class="modal-category"></div>
                <h2 id="modalTitle"></h2>
                <div id="modalPrice" class="modal-price"></div>
                <p id="modalDesc"></p>
                <button id="modalAddToCartBtn" class="modal-add-btn">Add To Bag</button>
            </div>
        </div>
    </div>
</div>

<!-- SLIDE-OUT CART DRAWER -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
        <h3 style="font-family: Georgia, serif;">Shopping Bag</h3>
        <button style="background:none; color:#fff; font-size:22px;" onclick="toggleCart()">&times;</button>
    </div>
    
    <div class="cart-items" id="cartItemsContainer"></div>

    <div class="cart-footer">
        <div class="cart-total-row">
            <span>Total:</span>
            <span id="cartTotal">₹0</span>
        </div>
        <button class="checkout-btn" onclick="openCheckout()">Checkout</button>
    </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="checkout-modal" id="checkoutModal">
    <div class="checkout-content">
        <button class="close-modal-btn" onclick="closeCheckout()">&times;</button>
        <h2 style="font-family: Georgia, serif;">Order Checkout</h2>
        
        <form class="checkout-form" onsubmit="processOrder(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Shipping Address</label>
                <input type="text" required placeholder="123 Street, City, Pincode">
            </div>
            <div class="form-group">
                <label>Card Number</label>
                <input type="text" required placeholder="4000 1234 5678 9010" maxlength="16">
            </div>
            <div style="margin-top: 10px; font-weight: bold; font-size: 15px;">
                Payable Amount: <span id="checkoutAmount">₹0</span>
            </div>
            <button type="submit" class="pay-now-btn">Pay & Place Order</button>
        </form>
    </div>
</div>

<!-- JAVASCRIPT LOGIC -->
<script>
// 1. PRODUCT DATABASE
const products = [
    { 
        id: 1, 
        name: 'Urban Essential Set', 
        category: 'SET', 
        price: 2499, 
        img: 'UE.png',
        desc: 'A relaxed contemporary set created for everyday movement. Soft fabric, clean tailoring and an easy silhouette make it a versatile wardrobe essential.'
    },
    { 
        id: 2, 
        name: 'Weekend Jacket', 
        category: 'OUTERWEAR', 
        price: 2299, 
        img: 'wj.png',
        desc: 'Lightweight relaxed jacket with a modern everyday fit. Features functional side pockets and a durable zip-front closure.'
    },
    { 
        id: 3, 
        name: 'Color Pop Top', 
        category: 'TOPS', 
        price: 599, 
        img: 'ct.png',
        desc: 'A bold contemporary top designed to brighten your wardrobe. Breathable cotton blend ideal for warmer days.'
    },
    { 
        id: 4, 
        name: 'Sunset Dress', 
        category: 'DRESSES', 
        price: 1799, 
        img: 'sd.png',
        desc: 'Flowing silhouette with a graceful finish for day or evening occasions. Elegant waist detailing for an adaptable look.'
    },
    { 
        id: 5, 
        name: 'Cozy Knit', 
        category: 'KNITS', 
        price: 1499, 
        img: 'CK.png',
        desc: 'Soft textured knit offering warmth without compromising style. Ribbed cuffs and hem line for added comfort.'
    },
    { 
        id: 6, 
        name: 'Everyday Denim Jacket', 
        category: 'OUTERWEAR', 
        price: 2199, 
        img: 'dj.png',
        desc: 'A timeless wardrobe staple with a modern cut and effortless everyday appeal. Crafted from premium wash denim.'
    }
];

let cart = [];

// 2. RENDER PRODUCT CARDS
function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = products.map(product => `
        <article class="product-card">
            <div class="product-image">
                <img src="${product.img}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/300x375?text=${product.name}'">
            </div>
            <div class="product-info">
                <div class="product-category">${product.category}</div>
                <h3 class="product-title">${product.name}</h3>
                <div class="product-price">₹${product.price.toLocaleString()}</div>
                <div class="btn-group">
                    <button class="view-btn" onclick="openProductModal(${product.id})">View Details</button>
                    <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Add To Bag</button>
                </div>
            </div>
        </article>
    `).join('');
}

// 3. PRODUCT MODAL HANDLERS
function openProductModal(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return;

    document.getElementById('modalImg').src = product.img;
    document.getElementById('modalCategory').innerText = product.category;
    document.getElementById('modalTitle').innerText = product.name;
    document.getElementById('modalPrice').innerText = `₹${product.price.toLocaleString()}`;
    document.getElementById('modalDesc').innerText = product.desc;
    
    const cartBtn = document.getElementById('modalAddToCartBtn');
    cartBtn.onclick = function() {
        addToCart(product.id);
        closeProductModal();
    };

    document.getElementById('productModal').classList.add('active');
}

function closeProductModal(e) {
    if (!e || e.target.id === 'productModal' || e.target.classList.contains('close-modal-btn')) {
        document.getElementById('productModal').classList.remove('active');
    }
}

// 4. CART HANDLERS
function addToCart(productId) {
    const itemIndex = cart.findIndex(item => item.id === productId);
    if (itemIndex > -1) {
        cart[itemIndex].qty += 1;
    } else {
        const product = products.find(p => p.id === productId);
        cart.push({ ...product, qty: 1 });
    }
    updateCartUI();
    openCart();
}

function updateQty(productId, change) {
    const itemIndex = cart.findIndex(item => item.id === productId);
    if (itemIndex > -1) {
        cart[itemIndex].qty += change;
        if (cart[itemIndex].qty <= 0) {
            cart.splice(itemIndex, 1);
        }
    }
    updateCartUI();
}

function removeItem(productId) {
    cart = cart.filter(item => item.id !== productId);
    updateCartUI();
}

function updateCartUI() {
    const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
    document.getElementById('cartCount').innerText = totalCount;

    const cartItemsContainer = document.getElementById('cartItemsContainer');
    if (cart.length === 0) {
        cartItemsContainer.innerHTML = `<div class="empty-cart-msg">Your bag is currently empty.</div>`;
    } else {
        cartItemsContainer.innerHTML = cart.map(item => `
            <div class="cart-item">
                <img src="${item.img}" class="cart-item-img" alt="${item.name}" onerror="this.src='https://via.placeholder.com/60x75'">
                <div class="cart-item-details">
                    <div class="cart-item-title">${item.name}</div>
                    <div class="cart-item-price">₹${(item.price * item.qty).toLocaleString()}</div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                        <button class="remove-item-btn" onclick="removeItem(${item.id})">Remove</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    document.getElementById('cartTotal').innerText = `₹${totalPrice.toLocaleString()}`;
    document.getElementById('checkoutAmount').innerText = `₹${totalPrice.toLocaleString()}`;
}

// 5. DRAWER & CHECKOUT VISIBILITY
function toggleCart() {
    document.getElementById('cartDrawer').classList.toggle('active');
    document.getElementById('cartOverlay').classList.toggle('active');
}

function openCart() {
    document.getElementById('cartDrawer').classList.add('active');
    document.getElementById('cartOverlay').classList.add('active');
}

function openCheckout() {
    if (cart.length === 0) {
        alert("Your bag is empty!");
        return;
    }
    toggleCart();
    document.getElementById('checkoutModal').classList.add('active');
}

function closeCheckout() {
    document.getElementById('checkoutModal').classList.remove('active');
}

function processOrder(e) {
    e.preventDefault();
    alert('Thank you! Your order has been placed successfully.');
    cart = [];
    updateCartUI();
    closeCheckout();
}

// Initialize on Load
renderProducts();
</script>

</body>
</html>
